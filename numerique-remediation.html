<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Remédiation Numérique — EU AD5 Prep</title>
<style>
:root {
  --bg: #f0f4ff;
  --bg-calm: #f0f7f2;
  --blue: #003399;
  --blue-dark: #001f66;
  --blue-light: #e8eeff;
  --gold: #FFCC00;
  --green: #1a7a4a;
  --green-bg: #e6f5ee;
  --orange: #cc8800;
  --orange-bg: #fff5ec;
  --text: #1a1f36;
  --gray: #5a6272;
  --gray-light: #f4f5f7;
  --white: #ffffff;
  --radius: 8px;
  --shadow: 0 2px 12px rgba(0,51,153,.08);
  --font: 'Trebuchet MS', Calibri, sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  font-size: 15px;
  line-height: 1.6;
  min-height: 100vh;
}
body.calm {
  background: var(--bg-calm);
  font-size: 17px;
}
body.calm .decorative { display: none; }
body.calm .exercise-card { padding: 28px 24px; }

/* HEADER */
.header {
  background: var(--blue-dark);
  color: var(--white);
  padding: 10px 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  z-index: 100;
}
.header-left { display: flex; align-items: center; gap: 12px; }
.header-left a {
  color: rgba(255,255,255,.7);
  text-decoration: none;
  font-size: 13px;
  padding: 4px 10px;
  border: 1px solid rgba(255,255,255,.2);
  border-radius: 4px;
}
.header-left a:hover { background: rgba(255,255,255,.1); }
.header-title {
  font-size: 15px;
  font-weight: 700;
  color: var(--gold);
}
.header-right { display: flex; align-items: center; gap: 10px; }
.btn-calm {
  background: none;
  border: 1px solid rgba(255,255,255,.3);
  color: rgba(255,255,255,.8);
  padding: 4px 10px;
  border-radius: 4px;
  cursor: pointer;
  font-size: 12px;
}
.btn-calm:hover { background: rgba(255,255,255,.1); }
.btn-calm.active { background: rgba(26,122,74,.3); border-color: var(--green); color: #8fdfb0; }
.btn-pause {
  background: none;
  border: 1px solid rgba(255,255,255,.3);
  color: rgba(255,255,255,.8);
  padding: 4px 10px;
  border-radius: 4px;
  cursor: pointer;
  font-size: 12px;
}

/* MAIN CONTAINER */
.container {
  max-width: 720px;
  margin: 0 auto;
  padding: 20px 16px 60px;
}

/* LEVEL SELECT */
.welcome-msg {
  text-align: center;
  padding: 30px 20px 20px;
}
.welcome-msg h1 {
  font-family: Georgia, serif;
  font-size: 22px;
  color: var(--blue);
  margin-bottom: 8px;
}
.welcome-msg p {
  color: var(--gray);
  font-size: 14px;
  max-width: 500px;
  margin: 0 auto;
}
.level-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
  margin-top: 20px;
}
.level-card {
  background: var(--white);
  border-radius: var(--radius);
  padding: 18px 14px;
  text-align: center;
  box-shadow: var(--shadow);
  cursor: pointer;
  border: 2px solid transparent;
  transition: .2s;
}
.level-card:hover:not(.locked) { border-color: var(--blue); transform: translateY(-2px); }
.level-card.locked { opacity: .45; cursor: not-allowed; filter: grayscale(.5); }
.level-card.current { border-color: var(--gold); background: #fffbec; }
.level-card .icon { font-size: 28px; display: block; margin-bottom: 6px; }
.level-card .name { font-weight: 700; font-size: 13px; color: var(--blue); }
.level-card .desc { font-size: 11px; color: var(--gray); margin-top: 4px; }
.level-card .badge-done {
  display: inline-block;
  background: var(--green);
  color: var(--white);
  font-size: 10px;
  padding: 1px 8px;
  border-radius: 10px;
  margin-top: 6px;
}

/* EXERCISE AREA */
.exercise-card {
  background: var(--white);
  border-radius: var(--radius);
  padding: 22px 20px;
  box-shadow: var(--shadow);
  margin-bottom: 16px;
}
.exercise-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 16px;
  font-size: 12px;
  color: var(--gray);
}
.level-indicator {
  background: var(--blue-light);
  color: var(--blue);
  padding: 3px 10px;
  border-radius: 12px;
  font-weight: 700;
  font-size: 11px;
}
.scene-text {
  background: var(--gray-light);
  border-left: 3px solid var(--blue);
  padding: 14px 16px;
  border-radius: 0 var(--radius) var(--radius) 0;
  margin-bottom: 16px;
  font-size: 14px;
  line-height: 1.7;
}
.question-text {
  font-size: 15px;
  font-weight: 600;
  margin-bottom: 14px;
  color: var(--text);
}
.options-list { display: flex; flex-direction: column; gap: 8px; }
.opt-btn {
  display: block;
  width: 100%;
  text-align: left;
  padding: 12px 16px;
  border: 2px solid #dde2f0;
  border-radius: var(--radius);
  background: var(--white);
  cursor: pointer;
  font-size: 14px;
  font-family: var(--font);
  color: var(--text);
  transition: .15s;
}
.opt-btn:hover:not(:disabled) { border-color: var(--blue); background: var(--blue-light); }
.opt-btn.correct { border-color: var(--green); background: var(--green-bg); }
.opt-btn.incorrect { border-color: var(--orange); background: var(--orange-bg); }
.opt-btn:disabled { cursor: default; }

/* FEEDBACK */
.feedback-box {
  margin-top: 14px;
  padding: 12px 16px;
  border-radius: var(--radius);
  font-size: 14px;
  display: none;
}
.feedback-box.show { display: block; }
.feedback-box.positive { background: var(--green-bg); border-left: 3px solid var(--green); color: #0f5a30; }
.feedback-box.neutral { background: var(--orange-bg); border-left: 3px solid var(--orange); color: #7a4a00; }

/* STEP-BY-STEP (level 2) */
.step-container { margin: 12px 0; }
.calc-step {
  background: var(--gray-light);
  border-radius: var(--radius);
  padding: 12px 16px;
  margin-bottom: 8px;
  border-left: 3px solid var(--blue);
}
.calc-step.active { border-left-color: var(--gold); background: #fffbec; }
.calc-step.done { border-left-color: var(--green); background: var(--green-bg); }
.calc-step .step-label { font-size: 11px; color: var(--gray); text-transform: uppercase; letter-spacing: .5px; }
.calc-step .step-text { font-size: 14px; margin-top: 4px; }
.step-input {
  display: inline-block;
  width: 100px;
  padding: 6px 10px;
  border: 2px solid var(--blue);
  border-radius: 4px;
  font-size: 15px;
  font-family: var(--font);
  text-align: center;
  margin: 0 4px;
}

/* BUTTONS */
.btn {
  display: inline-block;
  padding: 10px 20px;
  border: none;
  border-radius: var(--radius);
  font-family: var(--font);
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: .15s;
}
.btn-primary { background: var(--blue); color: var(--white); }
.btn-primary:hover { background: var(--blue-dark); }
.btn-gold { background: var(--gold); color: var(--blue-dark); }
.btn-outline { background: none; border: 1.5px solid var(--blue); color: var(--blue); }
.btn-outline:hover { background: var(--blue-light); }
.btn-help {
  background: none;
  border: 1px solid var(--orange);
  color: var(--orange);
  padding: 6px 12px;
  border-radius: 4px;
  font-size: 12px;
  cursor: pointer;
}

.action-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-top: 16px;
  flex-wrap: wrap;
  gap: 8px;
}

/* PROGRESS BAR */
.progress-bar {
  height: 6px;
  background: #e0e4f0;
  border-radius: 3px;
  overflow: hidden;
  margin-bottom: 16px;
}
.progress-fill {
  height: 100%;
  background: var(--blue);
  border-radius: 3px;
  transition: width .3s;
}

/* TABLE (levels 1-4) */
.data-table {
  width: 100%;
  border-collapse: collapse;
  margin: 12px 0;
  font-size: 13px;
}
.data-table th {
  background: var(--blue);
  color: var(--white);
  padding: 8px 10px;
  text-align: left;
  font-size: 12px;
}
.data-table td {
  padding: 7px 10px;
  border-bottom: 1px solid #e0e4f0;
}
.data-table tr:nth-child(even) td { background: var(--gray-light); }

/* SVG BAR CHART */
.bar-chart { margin: 12px 0; }

/* BADGE POPUP */
.badge-popup {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%) scale(0);
  background: var(--white);
  border: 3px solid var(--gold);
  border-radius: 16px;
  padding: 30px 40px;
  text-align: center;
  box-shadow: 0 8px 40px rgba(0,0,0,.2);
  z-index: 200;
  transition: transform .3s ease;
}
.badge-popup.show { transform: translate(-50%, -50%) scale(1); }
.badge-popup .badge-icon { font-size: 48px; display: block; margin-bottom: 10px; }
.badge-popup .badge-text { font-size: 16px; font-weight: 700; color: var(--blue); }
.badge-popup .badge-sub { font-size: 13px; color: var(--gray); margin-top: 4px; }

/* TIMER BAR (non stressant) */
.timer-bar {
  height: 4px;
  background: #e0e4f0;
  border-radius: 2px;
  margin-bottom: 12px;
}
.timer-fill {
  height: 100%;
  background: var(--blue);
  border-radius: 2px;
  transition: width 1s linear;
}
.timer-label {
  font-size: 11px;
  color: var(--gray);
  text-align: right;
  margin-bottom: 4px;
}

/* PAUSE OVERLAY */
.pause-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,31,102,.85);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 150;
}
.pause-overlay.show { display: flex; }
.pause-box {
  background: var(--white);
  border-radius: 16px;
  padding: 40px;
  text-align: center;
  max-width: 400px;
}
.pause-box h2 { color: var(--blue); margin-bottom: 10px; }
.pause-box p { color: var(--gray); margin-bottom: 20px; font-size: 14px; }

/* RESULT SCREEN */
.result-card {
  background: var(--white);
  border-radius: var(--radius);
  padding: 30px 24px;
  box-shadow: var(--shadow);
  text-align: center;
}
.result-card h2 { color: var(--blue); margin-bottom: 6px; }
.result-card .result-big {
  font-size: 36px;
  font-weight: 700;
  color: var(--green);
  font-family: Georgia, serif;
  margin: 12px 0;
}
.result-card .result-msg { color: var(--gray); font-size: 14px; margin-bottom: 20px; }

/* RESPONSIVE */
@media(max-width:700px) {
  .level-grid { grid-template-columns: repeat(2, 1fr); }
  .container { padding: 12px 10px 40px; }
  .exercise-card { padding: 16px 14px; }
  .data-table { font-size: 12px; display: block; overflow-x: auto; }
  .header-title { font-size: 13px; }
}
</style>
</head>
<body>

<!-- HEADER -->
<div class="header">
  <div class="header-left">
    <a href="index.html">← Retour</a>
    <span class="header-title">Remédiation Numérique</span>
  </div>
  <div class="header-right">
    <button class="btn-calm" onclick="toggleCalm()" title="Mode calme">🌿 Mode calme</button>
    <button class="btn-pause" onclick="togglePause()">⏸ Pause</button>
  </div>
</div>

<!-- MAIN CONTENT -->
<div class="container" id="main"></div>

<!-- BADGE POPUP -->
<div class="badge-popup" id="badge-popup">
  <span class="badge-icon" id="badge-icon"></span>
  <div class="badge-text" id="badge-text"></div>
  <div class="badge-sub" id="badge-sub"></div>
  <button class="btn btn-primary" style="margin-top:16px" onclick="closeBadge()">Continuer</button>
</div>

<!-- PAUSE OVERLAY -->
<div class="pause-overlay" id="pause-overlay">
  <div class="pause-box">
    <h2>Pause</h2>
    <p>Prends le temps qu'il faut. Il n'y a pas d'urgence ici.</p>
    <button class="btn btn-primary" onclick="togglePause()">Reprendre</button>
    <br><br>
    <button class="btn btn-outline" onclick="goHome()">Revenir au menu</button>
  </div>
</div>

/* ═══════════════════════════════════════════════════════
   ÉTAT & PERSISTENCE
   ═══════════════════════════════════════════════════════ */

const STORAGE_KEY = 'eu_ad5_remediation';
let S = {
  screen: 'home',
  level: 0,
  step: 0,
  answers: [],
  maxUnlocked: 0,
  calmMode: false,
  sessions: [],
  currentStepIndex: 0,
  timerStart: null,
  timerInterval: null
};

function save() {
  const d = { maxUnlocked: S.maxUnlocked, calmMode: S.calmMode, sessions: S.sessions.slice(-50) };
  localStorage.setItem(STORAGE_KEY, JSON.stringify(d));
}
function load() {
  try {
    const d = JSON.parse(localStorage.getItem(STORAGE_KEY));
    if (d) {
      S.maxUnlocked = d.maxUnlocked || 0;
      S.calmMode = d.calmMode || false;
      S.sessions = d.sessions || [];
    }
  } catch(e) {}
  if (S.calmMode) document.body.classList.add('calm');
}

/* ═══════════════════════════════════════════════════════
   NAVIGATION
   ═══════════════════════════════════════════════════════ */

function goHome() {
  clearTimer();
  S.screen = 'home';
  S.step = 0;
  S.answers = [];
  S.currentStepIndex = 0;
  document.getElementById('pause-overlay').classList.remove('show');
  renderHome();
}

function startLevel(id) {
  if (id > S.maxUnlocked && id !== 5) return;
  if (id === 5 && S.maxUnlocked < 4) return;
  S.level = id;
  S.step = 0;
  S.answers = [];
  S.currentStepIndex = 0;
  S.screen = 'exercise';
  if (id === 5) {
    const pool = [...LEVELS[3].questions, ...LEVELS[4].questions];
    LEVELS[5].questions = shuffle(pool).slice(0, 10);
  }
  renderExercise();
}

function shuffle(arr) { return [...arr].sort(() => Math.random() - .5); }

/* ═══════════════════════════════════════════════════════
   RENDER — HOME
   ═══════════════════════════════════════════════════════ */

function renderHome() {
  const main = document.getElementById('main');
  const returnMsg = S.sessions.length > 0
    ? `<p style="margin-top:8px;color:var(--green);font-weight:600">Bon retour ! Tu en étais au Niveau ${S.maxUnlocked}.</p>`
    : '';
  main.innerHTML = `
    <div class="welcome-msg">
      <h1>Remédiation Numérique</h1>
      <p>Ce module n'est pas un test. Tu ne peux pas échouer ici.<br>
      Chaque étape est conçue pour t'aider à avancer à ton rythme.</p>
      ${returnMsg}
    </div>
    <div class="level-grid">
      ${LEVELS.map(lv => {
        const locked = lv.id > S.maxUnlocked && !(lv.id === 5 && S.maxUnlocked >= 4);
        const done = S.sessions.some(s => s.level === lv.id);
        const cls = locked ? 'locked' : (lv.id === S.maxUnlocked && !done ? 'current' : '');
        return `<div class="level-card ${cls}" onclick="${locked ? '' : `startLevel(${lv.id})`}">
          <span class="icon">${lv.icon}</span>
          <div class="name">Niveau ${lv.id}</div>
          <div class="desc">${lv.name}</div>
          <div class="desc">${lv.desc}</div>
          ${done ? `<span class="badge-done">Complété</span>` : ''}
          ${locked ? '<div class="desc" style="margin-top:4px">🔒</div>' : ''}
        </div>`;
      }).join('')}
    </div>
    ${S.sessions.length > 0 ? renderProgressChart() : ''}
  `;
}

function renderProgressChart() {
  const last = S.sessions.slice(-10);
  if (last.length < 2) return '';
  const max = Math.max(...last.map(s => s.score));
  const w = 100 / last.length;
  const bars = last.map((s, i) =>
    `<rect x="${i * w + w * 0.15}%" y="${100 - (s.score / max) * 80}%" width="${w * 0.7}%" height="${(s.score / max) * 80}%" fill="var(--blue)" rx="2"/>`
  ).join('');
  return `
    <div class="exercise-card" style="margin-top:20px">
      <div style="font-weight:700;color:var(--blue);margin-bottom:8px">Ta progression</div>
      <svg viewBox="0 0 100 100" style="width:100%;height:80px;background:var(--gray-light);border-radius:var(--radius)">
        <line x1="0" y1="98%" x2="100%" y2="98%" stroke="#dde2f0" stroke-width="0.5"/>
        ${bars}
      </svg>
      <div style="font-size:11px;color:var(--gray);margin-top:4px">${last.length} dernières sessions</div>
    </div>`;
}

/* ═══════════════════════════════════════════════════════
   RENDER — EXERCISE DISPATCHER
   ═══════════════════════════════════════════════════════ */

function renderExercise() {
  const lv = LEVELS[S.level];
  const q = lv.questions[S.step];
  if (!q) { finishLevel(); return; }
  const total = lv.questions.length;
  const pct = (S.step / total) * 100;

  let content = '';
  if (S.level === 0) content = renderQ_level0(q);
  else if (S.level === 1) content = renderQ_level1(q);
  else if (S.level === 2) content = renderQ_level2(q);
  else if (S.level === 3) content = renderQ_level3(q);
  else if (S.level >= 4) content = renderQ_level4(q);

  const showTimer = (S.level === 4 || S.level === 5);
  const timerHTML = showTimer ? `<div class="timer-label" id="timer-label"></div><div class="timer-bar"><div class="timer-fill" id="timer-fill" style="width:100%"></div></div>` : '';

  document.getElementById('main').innerHTML = `
    <div class="exercise-card">
      <div class="exercise-header">
        <span class="level-indicator">${lv.icon} Niveau ${lv.id} · ${lv.name}</span>
        <span>Question ${S.step + 1} / ${total}</span>
      </div>
      <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
      ${timerHTML}
      ${content}
      <div class="feedback-box" id="feedback"></div>
      <div class="action-bar" id="actions" style="display:none">
        <button class="btn btn-outline" onclick="goHome()">Menu</button>
        <button class="btn btn-primary" onclick="nextStep()">Continuer →</button>
      </div>
    </div>`;

  if (showTimer && !S.timerStart) startTimer();
}

/* ═══════════════════════════════════════════════════════
   RENDER — LEVEL 0 (observation)
   ═══════════════════════════════════════════════════════ */

function renderQ_level0(q) {
  return `
    <div class="scene-text">${q.scene}</div>
    <div class="question-text">${q.q}</div>
    <div class="options-list">
      ${q.opts.map((o, i) => `<button class="opt-btn" onclick="answer(${i})">${o}</button>`).join('')}
    </div>`;
}

/* ═══════════════════════════════════════════════════════
   RENDER — LEVEL 1 (tables & bars)
   ═══════════════════════════════════════════════════════ */

function renderQ_level1(q) {
  let visual = '';
  if (q.type === 'table') {
    visual = renderTable({title: q.title, headers: q.headers, rows: q.rows});
  } else if (q.type === 'bar') {
    const maxVal = Math.max(...q.bars.map(b => b.value));
    const barsSVG = q.bars.map((b, i) => {
      const h = (b.value / maxVal) * 120;
      const x = 30 + i * 80;
      return `<rect x="${x}" y="${150 - h}" width="50" height="${h}" fill="${b.color}" rx="3"/>
              <text x="${x + 25}" y="${165}" text-anchor="middle" font-size="10" fill="var(--gray)">${b.label}</text>
              <text x="${x + 25}" y="${145 - h}" text-anchor="middle" font-size="10" fill="var(--text)" font-weight="600">${b.value}</text>`;
    }).join('');
    visual = `<div class="bar-chart"><svg viewBox="0 0 ${30 + q.bars.length * 80 + 20} 180" style="width:100%;max-height:160px">
      <text x="10" y="14" font-size="11" fill="var(--blue)" font-weight="700">${q.title}</text>
      <line x1="25" y1="150" x2="${25 + q.bars.length * 80 + 10}" y2="150" stroke="#dde2f0"/>
      ${barsSVG}
    </svg></div>`;
  }
  return `
    ${visual}
    <div class="question-text">${q.q}</div>
    <div class="options-list">
      ${q.opts.map((o, i) => `<button class="opt-btn" onclick="answer(${i})">${o}</button>`).join('')}
    </div>`;
}

/* ═══════════════════════════════════════════════════════
   RENDER — LEVEL 2 (step by step)
   ═══════════════════════════════════════════════════════ */

function renderQ_level2(q) {
  S.currentStepIndex = 0;
  return `
    <div class="scene-text">${q.context}</div>
    <div class="question-text">${q.q}</div>
    <div class="step-container" id="steps-container">
      ${renderSteps(q)}
    </div>`;
}

function renderSteps(q) {
  return q.steps.map((st, i) => {
    if (st.final) {
      return `<div class="calc-step ${i <= S.currentStepIndex ? '' : 'hidden'}" id="step-${i}" style="${i > S.currentStepIndex ? 'display:none' : ''}">
        <div class="step-label">Résultat</div>
        <div class="step-text" style="color:var(--green);font-weight:700">${st.text}</div>
      </div>`;
    }
    const active = i === S.currentStepIndex;
    return `<div class="calc-step ${active ? 'active' : (i < S.currentStepIndex ? 'done' : '')}" id="step-${i}" style="${i > S.currentStepIndex ? 'display:none' : ''}">
      <div class="step-label">Étape ${i + 1}</div>
      <div class="step-text">${st.text.replace('?', `<input type="text" class="step-input" id="input-${i}" placeholder="?" ${active ? '' : 'disabled'}>`)}</div>
      ${st.hint ? `<div style="font-size:11px;color:var(--gray);margin-top:4px;cursor:pointer" onclick="this.innerHTML='💡 '+this.dataset.hint" data-hint="${st.hint}">💡 Besoin d'un indice ?</div>` : ''}
      ${active ? `<button class="btn btn-primary" style="margin-top:8px;padding:6px 14px;font-size:13px" onclick="checkStep(${i})">Valider cette étape</button>` : ''}
    </div>`;
  }).join('');
}

function checkStep(i) {
  const q = LEVELS[S.level].questions[S.step];
  const st = q.steps[i];
  const input = document.getElementById('input-' + i);
  const val = input.value.replace(/\s/g, '').replace(',', '.');
  const expected = String(st.answer).replace(',', '.');
  if (Math.abs(parseFloat(val) - parseFloat(expected)) < 0.1 || val === expected) {
    document.getElementById('step-' + i).classList.remove('active');
    document.getElementById('step-' + i).classList.add('done');
    input.disabled = true;
    input.style.borderColor = 'var(--green)';
    input.style.background = 'var(--green-bg)';
    S.currentStepIndex = i + 1;
    const nextStep = q.steps[S.currentStepIndex];
    if (nextStep) {
      document.getElementById('step-' + S.currentStepIndex).style.display = '';
      if (nextStep.final) {
        document.getElementById('step-' + S.currentStepIndex).style.display = '';
        S.answers.push(true);
        showFeedback(true, "Bravo, tu as trouvé en décomposant le calcul !");
      } else {
        document.getElementById('step-' + S.currentStepIndex).classList.add('active');
        document.getElementById('steps-container').innerHTML = renderSteps(q);
      }
    }
  } else {
    input.style.borderColor = 'var(--orange)';
    input.style.background = 'var(--orange-bg)';
    showInlineFeedback('Pas tout à fait — réessaie ! ' + (st.hint || ''));
    setTimeout(() => { input.style.borderColor = 'var(--blue)'; input.style.background = ''; input.value = ''; input.focus(); }, 1500);
  }
}

function showInlineFeedback(msg) {
  const fb = document.getElementById('feedback');
  fb.className = 'feedback-box show neutral';
  fb.innerHTML = msg;
  setTimeout(() => fb.classList.remove('show'), 2000);
}

/* ═══════════════════════════════════════════════════════
   RENDER — LEVEL 3 (EPSO simplifié + aide)
   ═══════════════════════════════════════════════════════ */

function renderQ_level3(q) {
  const tableHTML = q.table ? renderTable(q.table) : '';
  return `
    ${tableHTML}
    <div class="question-text">${q.q}</div>
    <div style="margin-bottom:10px">
      <button class="btn-help" onclick="showMethod(this)" data-method="${encodeURIComponent(q.method)}">💡 Montre-moi la méthode</button>
    </div>
    <div id="method-box" style="display:none;background:var(--blue-light);border-radius:var(--radius);padding:10px 14px;margin-bottom:12px;font-size:13px;color:var(--blue)"></div>
    <div class="options-list">
      ${q.opts.map((o, i) => `<button class="opt-btn" onclick="answer(${i})">${o}</button>`).join('')}
    </div>`;
}

function showMethod(btn) {
  const box = document.getElementById('method-box');
  box.style.display = 'block';
  box.innerHTML = '💡 ' + decodeURIComponent(btn.dataset.method);
  btn.disabled = true;
  btn.style.opacity = '.5';
}

/* ═══════════════════════════════════════════════════════
   RENDER — LEVEL 4 & 5 (EPSO authentique)
   ═══════════════════════════════════════════════════════ */

function renderQ_level4(q) {
  const tableHTML = q.table ? renderTable(q.table) : '';
  const safetyBtn = S.level === 5
    ? `<button class="btn-help" onclick="showMethod(this)" data-method="${encodeURIComponent(q.explanation || '')}">🛟 Méthode rapide</button>`
    : '';
  return `
    ${tableHTML}
    <div class="question-text">${q.q}</div>
    ${safetyBtn ? `<div style="margin-bottom:10px">${safetyBtn}</div><div id="method-box" style="display:none;background:var(--blue-light);border-radius:var(--radius);padding:10px 14px;margin-bottom:12px;font-size:13px;color:var(--blue)"></div>` : ''}
    <div class="options-list">
      ${q.opts.map((o, i) => `<button class="opt-btn" onclick="answer(${i})">${o}</button>`).join('')}
    </div>`;
}

/* ═══════════════════════════════════════════════════════
   SHARED — TABLE RENDERER
   ═══════════════════════════════════════════════════════ */

function renderTable(t) {
  return `<div style="font-weight:700;color:var(--blue);font-size:13px;margin-bottom:4px">${t.title}</div>
    <table class="data-table">
      <thead><tr>${t.headers.map(h => `<th>${h}</th>`).join('')}</tr></thead>
      <tbody>${t.rows.map(r => `<tr>${(Array.isArray(r) ? r : Object.values(r)).map(c => `<td>${c}</td>`).join('')}</tr>`).join('')}</tbody>
    </table>`;
}

/* ═══════════════════════════════════════════════════════
   ANSWER & FEEDBACK
   ═══════════════════════════════════════════════════════ */

function answer(selected) {
  const q = LEVELS[S.level].questions[S.step];
  const correct = selected === q.correct;
  S.answers.push(correct);

  document.querySelectorAll('.opt-btn').forEach((btn, i) => {
    btn.disabled = true;
    if (i === q.correct) btn.classList.add('correct');
    else if (i === selected && !correct) btn.classList.add('incorrect');
  });

  const messages = {
    positive: ['Bien vu !', 'Exactement !', 'Bravo !', 'Parfait !', 'Tu as trouvé !'],
    neutral: ['Pas tout à fait — regarde ici :', 'Presque ! La bonne réponse est :', 'Pas cette fois — voici la réponse :']
  };

  const msg = correct
    ? messages.positive[Math.floor(Math.random() * messages.positive.length)]
    : messages.neutral[Math.floor(Math.random() * messages.neutral.length)];

  const explanation = q.explanation
    ? `<div style="margin-top:6px;font-size:13px">${q.explanation}</div>`
    : '';

  showFeedback(correct, msg + (correct ? '' : ` <strong>${q.opts[q.correct]}</strong>`) + explanation);
}

function showFeedback(correct, msg) {
  const fb = document.getElementById('feedback');
  fb.className = `feedback-box show ${correct ? 'positive' : 'neutral'}`;
  fb.innerHTML = msg;
  document.getElementById('actions').style.display = 'flex';
}

function nextStep() {
  S.step++;
  if (S.step >= LEVELS[S.level].questions.length) {
    finishLevel();
  } else {
    renderExercise();
  }
}

/* ═══════════════════════════════════════════════════════
   FINISH LEVEL
   ═══════════════════════════════════════════════════════ */

function finishLevel() {
  clearTimer();
  const lv = LEVELS[S.level];
  const correct = S.answers.filter(Boolean).length;
  const total = S.answers.length;
  const good = correct >= Math.ceil(total * 0.7);

  S.sessions.push({ level: S.level, score: correct, total, date: new Date().toISOString() });

  if (good && S.level === S.maxUnlocked && S.level < 5) {
    S.maxUnlocked = S.level + 1;
  }
  save();

  const resultMsg = good
    ? `Tu as réussi ${correct} questions sur ${total}. Le niveau suivant est débloqué !`
    : `Tu as réussi ${correct} questions sur ${total}. Continue à t'entraîner sur ce niveau, tu progresses !`;

  document.getElementById('main').innerHTML = `
    <div class="result-card">
      <h2>${lv.icon} ${lv.name} — Terminé</h2>
      <div class="result-big">${correct} sur ${total}</div>
      <div class="result-msg">${resultMsg}</div>
      <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap">
        <button class="btn btn-outline" onclick="startLevel(${S.level})">Refaire ce niveau</button>
        ${good && S.level < 5 ? `<button class="btn btn-primary" onclick="startLevel(${S.level + 1})">Niveau suivant →</button>` : ''}
        <button class="btn btn-outline" onclick="goHome()">Menu</button>
      </div>
    </div>`;

  if (good && lv.badge) {
    setTimeout(() => showBadge(lv.badgeIcon, lv.badge, `Niveau ${lv.id} complété !`), 500);
  }
}

/* ═══════════════════════════════════════════════════════
   TIMER (niveaux 4-5)
   ═══════════════════════════════════════════════════════ */

function startTimer() {
  S.timerStart = Date.now();
  const total = S.level === 5 ? 20 * 60 * 1000 : 2 * 60 * 1000;
  S.timerInterval = setInterval(() => {
    const elapsed = Date.now() - S.timerStart;
    const pct = Math.max(0, 100 - (elapsed / total) * 100);
    const remaining = Math.max(0, Math.ceil((total - elapsed) / 60000));
    const fill = document.getElementById('timer-fill');
    const label = document.getElementById('timer-label');
    if (fill) fill.style.width = pct + '%';
    if (label) label.textContent = remaining > 0 ? `Environ ${remaining} min restantes` : '';
    if (pct <= 0) {
      clearTimer();
      if (label) label.textContent = 'On fait une pause ?';
    }
  }, 1000);
}

function clearTimer() {
  if (S.timerInterval) { clearInterval(S.timerInterval); S.timerInterval = null; }
  S.timerStart = null;
}

/* ═══════════════════════════════════════════════════════
   UX — BADGE, CALM, PAUSE
   ═══════════════════════════════════════════════════════ */

function showBadge(icon, text, sub) {
  document.getElementById('badge-icon').textContent = icon;
  document.getElementById('badge-text').textContent = text;
  document.getElementById('badge-sub').textContent = sub;
  document.getElementById('badge-popup').classList.add('show');
}
function closeBadge() { document.getElementById('badge-popup').classList.remove('show'); }

function toggleCalm() {
  S.calmMode = !S.calmMode;
  document.body.classList.toggle('calm', S.calmMode);
  document.querySelector('.btn-calm').classList.toggle('active', S.calmMode);
  save();
}

function togglePause() {
  document.getElementById('pause-overlay').classList.toggle('show');
}

/* ═══════════════════════════════════════════════════════
   INIT
   ═══════════════════════════════════════════════════════ */

load();
goHome();

</script>
